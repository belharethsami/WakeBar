name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run logic tests
        run: make test

      - name: Build debug executable
        run: make build
